      <div class="ld-prog">
        <div class="ld-row">
          <div class="ld-spin"></div>
          <div class="ld-stage"><b id="ld-stage">準備中</b><small id="ld-stage-en">Preparing</small></div>

    <script>
      /* Boot watchdog (round 6 stability, RC1). The game is one module graph (the entry + 7 modulepreloaded chunks): if
         any request of it fails (a network blip, or the HTML of a previous deploy asking for chunks that now 404) or
         stalls, src/main.ts never runs and the loader used to sit at 「準備中 0%」 forever, with no message. Here:
           - a module script / modulepreload error before main.ts ran → fail at once;
           - main.ts has not started 20 s after the page (30 s on phones / tablets) while no request finished for 15 s
             → fail; after it started: no loading report (main.ts bumps window.__tgtaTick) and no finished request for
             60 s (75 s on phones / tablets — the player stage alone may wait 30 s for the heroes + 10 s for the mocap
             pack before its fallbacks) → fail. Paused while the page is hidden or waits for a tap (.failed);
           - fail → ONE automatic cache-busting reload per 5 min (sessionStorage 'tgta-boot-retry'; main.ts clears it once
             a load succeeds and strips ?r= from the address bar), else the error box with a Reload button (never a loop).
             Before either reload the entry chunks are re-requested (fetch, cache: 'no-cache' — a 304 for the good ones):
             WebKit keeps a FAILED modulepreload in its in-process memory cache and hands it to the next page (a one-off
             503 on one chunk failed the retry too), and the re-request replaces that entry.
         window.__tgtaLoaderError(text) shows the error box (the loader script's 「載入失敗」 path uses it too). */
      (function () {
        var L = document.getElementById('loader');
        if (!L) return;
        var EN = false;
        try { var sv = JSON.parse(localStorage.getItem('taipei-rush-save-v1') || '{}'); EN = !!(sv && sv.settings && sv.settings.lang === 'en'); } catch (e) {}
        var compact = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
        var RETRY = 'tgta-boot-retry';
        var t0 = Date.now(), lastTick = t0, nRes = -1, done = false, iv = 0;
        function retryUrl() {
          var q = '';
          try { var p = new URLSearchParams(location.search); p.set('r', String(Date.now())); q = '?' + p.toString(); } catch (e) { q = '?r=' + Date.now(); }
          return location.pathname + q + location.hash;
        }
        function retry() {
          var go = function () { location.replace(retryUrl()); };
          try {
            var urls = [].map.call(document.querySelectorAll('link[rel=modulepreload], script[type=module][src]'), function (el) { return el.href || el.src; });
            var ps = urls.filter(function (u) { return u && u.indexOf(location.origin + '/') === 0; }).map(function (u) {
              return fetch(u, { cache: 'no-cache', credentials: 'same-origin' }).catch(function () {});
            });
            Promise.race([Promise.all(ps), new Promise(function (r) { setTimeout(r, 6000); })]).then(go, go);
          } catch (e) { go(); }
        }
        function showError(text) {
          L.classList.add('failed');
          L.setAttribute('role', 'group');
          L.setAttribute('aria-label', EN ? 'Loading interrupted' : '載入中斷');
          var box = document.getElementById('ld-err');
          if (!box) return;
          box.textContent = '';
          var msg = document.createElement('div');
          msg.textContent = text;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = EN ? 'Reload' : '重新載入';
          btn.addEventListener('click', function () {
            try { sessionStorage.removeItem(RETRY); } catch (e) {}
            btn.disabled = true;
            retry();
          });
          box.appendChild(msg);
          box.appendChild(btn);
        }
        window.__tgtaLoaderError = showError;
        function bootFail(kind) {
          if (done || !L.isConnected) return;
          done = true;
          clearInterval(iv);
          var last = 0, canRetry = false;
          try { last = Number(sessionStorage.getItem(RETRY)) || 0; sessionStorage.setItem(RETRY, String(Date.now())); canRetry = true; } catch (e) {}
          console.warn('[boot] loading ' + (kind === 'module' ? 'failed (a script did not load)' : kind === 'start' ? 'never started' : 'stalled') + (canRetry && !(last && Date.now() - last < 300000) ? ' — reloading once' : ''));
          if (canRetry && !(last && Date.now() - last < 300000)) {
            // (a moment for the other elements' errors of this failure, then the refresh + reload)
            setTimeout(retry, 300);
            return;
          }
          showError(EN ? 'Taipei GTA could not finish loading (the network or a server file failed). Please reload.' : '臺北GTA 無法完成載入（網路或伺服器檔案異常），請重新載入。');
        }
        // a failed module script / modulepreload of the entry graph (after main.ts ran, lazy chunks are core's business)
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (window.__tgtaBoot || !t || t === window || !t.tagName) return;
          if ((t.tagName === 'SCRIPT' && t.type === 'module') || (t.tagName === 'LINK' && /modulepreload/.test(t.rel || ''))) bootFail('module');
        }, true);
        // finished requests count as progress (a slow network is not a stalled one)
        try { new PerformanceObserver(function () { lastTick = Date.now(); }).observe({ type: 'resource', buffered: false }); } catch (e) {}
        iv = setInterval(function () {
          var now = Date.now();
          if (!L.isConnected || L.style.opacity === '0') return clearInterval(iv);
          if (document.hidden || L.classList.contains('failed')) { lastTick = now; return; }
          try { var n = performance.getEntriesByType('resource').length; if (n !== nRes) { nRes = n; lastTick = now; } } catch (e) {}
          var tick = window.__tgtaTick || 0;
          if (tick > lastTick) lastTick = tick;
          if (!window.__tgtaBoot) {
            if (now - t0 > (compact ? 30000 : 20000) && now - lastTick > 15000) bootFail('start');
          } else if (now - lastTick > (compact ? 75000 : 60000)) bootFail('stall');
        }, 5000);
      })();
    </script>
    <script>
      /* Loader: a static key-art photo (an in-game screenshot, public/title/loader-*.webp) under a static gradient; maps
         raw init labels to localized, monotonic, duration-weighted progress; one Taipei / controls tip in the saved
         language. Only the progress indicator moves. */
      (function () {
        var L = document.getElementById('loader');
        if (!L) return;
        var observers = [];
        var lang = 'zh';
        try { var sv = JSON.parse(localStorage.getItem('taipei-rush-save-v1') || '{}'); if (sv && sv.settings && sv.settings.lang === 'en') lang = 'en'; } catch (e) {}
        var EN = lang === 'en';
        if (EN) document.documentElement.lang = 'en';

        // ---------------------------------------------------------------- photo
        // Requested once the entry scripts have run (DOMContentLoaded waits for the module graph): a 180–350 KB image
        // fetched in parallel delayed main.ts by ~250 ms at 10 Mbit/s. Until it is decoded — or if it fails — the
        // inline blurred placeholder; shown once decoded (never half-painted rows). A later source switch (rotation →
        // the portrait crop) keeps the current picture until the new one has loaded.
        var ph = L.querySelector('.ld-photo'), im = ph && ph.querySelector('img');
        function reveal() { if (im && im.naturalWidth) ph.classList.add('on'); }
        function loadPhoto() {
          if (!im || !L.isConnected || im.getAttribute('srcset')) return;
          var so = ph.querySelector('source');
          if (so) so.srcset = so.getAttribute('data-srcset');
          im.addEventListener('load', function () { if (im.decode) im.decode().then(reveal, reveal); else reveal(); });
          im.srcset = im.getAttribute('data-srcset');
          im.src = im.getAttribute('data-src');
        }
        document.addEventListener('DOMContentLoaded', loadPhoto, { once: true });

        // ---------------------------------------------------------------- tip (one per load, static)
        var TIPS = [
          ['垃圾車播〈給愛麗絲〉的時候，全臺北都會拎著垃圾衝出門。', 'When the garbage truck plays Für Elise, all of Taipei runs outside with their trash.'],
          ['臺北101 高 508 公尺，跨年煙火就從這裡點亮夜空。', 'Taipei 101 is 508 m tall — the New Year fireworks launch right off its sides.'],
          ['走到機車或汽車旁按 F（手把 Y）就能騎上去；機車可以鑽車縫。', 'Press F (gamepad Y) next to a scooter or car to ride it. Scooters can filter through traffic.'],
          ['臺北的紅綠燈有倒數秒數，黃燈別硬闖——測速照相會拍你。', "Taipei's lights count down. Don't gamble on yellow — speed cameras are watching."],
          ['便利商店的茶葉蛋可以回血，一顆只要 13 元。', 'Tea eggs from convenience stores restore health — only NT$13.'],
          ['按 M 打開地圖，點一下就能設定導航；按 T 打開手機接任務。', 'Press M for the map and click to set GPS. Press T to open your phone for jobs.'],
          ['捷運站入口可以快速移動到城市另一頭。', 'MRT entrances fast-travel you across the city.'],
          ['下雨天路面濕滑，煞車距離會變長。', 'Rain makes the roads slippery — brake earlier.'],
          ['夜市晚上七點以後最熱鬧：雞排、臭豆腐、珍珠奶茶。', 'Night markets come alive after 7 pm: fried chicken, stinky tofu, bubble tea.'],
          ['騎樓是臺北人的雨天走廊，走在底下不會淋濕。', 'The arcades (騎樓) are Taipei’s rain corridors — walk under them to stay dry.'],
          ['按住 Shift（手把 B）衝刺；開車時空白鍵是手煞車。', 'Hold Shift (gamepad B) to sprint. In a vehicle, Space is the handbrake.'],
          ['龍山寺建於 1738 年，是臺北最古老的廟宇之一。', 'Longshan Temple dates from 1738 — one of the oldest temples in Taipei.'],
        ];
        document.getElementById('ld-tip-k').textContent = EN ? 'Taipei tip' : '臺北小知識';
        document.getElementById('ld-tips').textContent = TIPS[(Math.random() * TIPS.length) | 0][EN ? 1 : 0];

        // ---------------------------------------------------------------- progress
        // main.ts writes the RAW stage key into #loader-label ('streets', 'districts'… 'ready' = shader warm-up) and the
        // progress WITHIN that stage as #loader-bar width. This loader owns the weights: each stage's share of the bar
        // is its measured init time (M-class laptop, high, round 4: districts ≈ 1.4 s now that it reports per pack, the
        // shader compile + warm frames ≈ 1.1 s), so the bar moves at an even speed. A localized label (older main.ts)
        // is mapped back through LABEL_KEY; an unknown key keeps the bar where it is (monotonic).
        var ORDER = ['audio', 'environment', 'streets', 'buildings', 'landmarks', 'districts', 'culture', 'transit', 'player',
          'vehicles', 'traffic', 'peds', 'police', 'missions', 'camera', 'ui', 'ready'];
        var WEIGHT = {
          audio: 0.3, environment: 3.8, streets: 5.2, buildings: 5.2, landmarks: 2.2, districts: 13.5, culture: 1.5, transit: 0.7,
          player: 0.5, vehicles: 1.3, traffic: 0.3, peds: 1.1, police: 1, missions: 0.4, camera: 0.1, ui: 0.5, ready: 11,
        };
        var BASE = {}, TOTAL = 0;
        ORDER.forEach(function (k) { BASE[k] = TOTAL; TOTAL += WEIGHT[k]; });
        /** global 0..1 for (stage key, progress within it); NaN for an unknown key */
        function globalOf(key, local) {
          if (!(key in BASE)) return NaN;
          return (BASE[key] + WEIGHT[key] * Math.max(0, Math.min(1, local || 0))) / TOTAL;
        }
        var STAGES = {
          loading: ['載入中', 'Loading'], audio: ['調校聲音', 'Tuning the soundscape'], environment: ['天空、山與河', 'Sky, hills & rivers'],
          streets: ['鋪設街道', 'Laying the streets'], buildings: ['蓋起公寓與騎樓', 'Walk-ups & arcades'], landmarks: ['臺北101與地標', 'Taipei 101 & landmarks'],
          districts: ['街區與巷弄', 'Neighbourhoods & alleys'], culture: ['夜市與廟宇', 'Night markets & temples'], transit: ['捷運路網', 'MRT network'],
          player: ['主角', 'Protagonists'], vehicles: ['機車與汽車', 'Scooters & cars'], traffic: ['車流', 'Traffic'], peds: ['行人', 'Pedestrians'],
          police: ['警察', 'Police'], missions: ['任務', 'Missions'], camera: ['攝影機', 'Camera'], ui: ['介面', 'Interface'],
          shaders: ['點亮霓虹', 'Lighting the neon'], ready: ['去臺北狂飆！', "Let's ride!"],
        };
        var LABEL_KEY = {
          '載入中…': 'loading', 'Loading…': 'loading', '調音中': 'audio', 'Tuning the radio': 'audio', '天空與天氣': 'environment', 'Sky & weather': 'environment',
          '鋪設街道': 'streets', 'Paving the streets': 'streets', '蓋起街屋與騎樓': 'buildings', 'Raising the blocks': 'buildings',
          '臺北101與地標': 'landmarks', '台北101與地標': 'landmarks', 'Taipei 101 & landmarks': 'landmarks', '街區細節': 'districts', 'Neighbourhood details': 'districts',
          '夜市與廟宇': 'culture', 'Night markets & temples': 'culture', '捷運': 'transit', 'MRT': 'transit', '主角': 'player', 'Protagonist': 'player',
          '機車與汽車': 'vehicles', 'Scooters & cars': 'vehicles', '車流': 'traffic', 'Traffic': 'traffic', '行人': 'peds', 'Pedestrians': 'peds',
          '警察': 'police', 'Police': 'police', '任務': 'missions', 'Missions': 'missions', '攝影機': 'camera', 'Camera': 'camera', '介面': 'ui', 'Interface': 'ui',
          '點亮霓虹': 'shaders', 'Lighting the neon': 'shaders', '去臺北狂飆！': 'ready', "Let's ride!": 'ready',
        };
        var shownP = 0, curStage = '';
        var fill = document.getElementById('ld-fill'), pct = document.getElementById('ld-pct');
        var stZh = document.getElementById('ld-stage'), stEn = document.getElementById('ld-stage-en');
        function setStageText(key, raw) {
          var s = STAGES[key];
          // unknown key (a new module): show what main.ts wrote rather than freezing on the previous stage
          stZh.textContent = s ? s[EN ? 1 : 0] : raw || (EN ? 'Loading' : '載入中');
          stEn.textContent = s ? s[EN ? 0 : 1] : '';
        }
        function show(p) {
          p = Math.max(shownP, Math.min(1, p));
          shownP = p;
          fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
          var n = Math.floor(p * 100);
          pct.firstChild.nodeValue = String(n);
          L.setAttribute('aria-valuenow', String(n));
          L.classList.add('has-pct');
        }
        function onLoading(raw, f) {
          if (/^載入失敗|Failed/.test(raw)) {
            var detail = raw.replace(/^(?:載入失敗：?|Failed to load:\s*)/i, '');
            var text = EN ? 'Taipei GTA failed to load. Please reload. (' + detail + ')' : '臺北GTA 載入失敗，請重新載入。（' + detail + '）';
            // the boot watchdog's error box (with a Reload button); plain text if that script is missing
            if (window.__tgtaLoaderError) window.__tgtaLoaderError(text);
            else { L.classList.add('failed'); document.getElementById('ld-err').textContent = text; }
            return;
          }
          var key = lab.getAttribute('data-key') || LABEL_KEY[raw] || String(raw).split(':')[0].trim();
          if (key === 'shaders') key = 'ready';
          if (key !== curStage) {
            curStage = key;
            setStageText(key, raw);
          }
          var g = globalOf(key, f);
          if (isFinite(g)) show(g);
        }
        // main.ts writes the stage key (or a localized label + data-key) and the in-stage width % into these sinks
        var bar = document.getElementById('loader-bar'), lab = document.getElementById('loader-label');
        var lastRaw = '', lastW = '';
        function poll() {
          var raw = (lab.textContent || '').trim(), w = bar.style.width || '';
          var k = raw + '|' + (lab.getAttribute('data-key') || '');
          if (k === lastRaw && w === lastW) return;
          lastRaw = k; lastW = w;
          onLoading(raw, w ? parseFloat(w) / 100 : NaN);
        }
        // leaving: the progress UI fades first, the brand mark glides into the title logo (FLIP), then the art
        function leave() {
          if (L.classList.contains('leaving')) return;
          setStageText('ready'); show(1);
          L.classList.add('leaving');
          var logo = L.querySelector('.ld-logo'), to = document.querySelector('.ti.show .ti-logo-svg');
          if (!logo || !to) return;
          var a = logo.getBoundingClientRect(), b = to.getBoundingClientRect();
          if (!a.width || !b.width) return;
          var s = b.width / a.width, ex = 0, ey = 0;
          try { var cm = new DOMMatrix(getComputedStyle(logo).transform); ex = cm.e; ey = cm.f; } catch (e) {}
          a = { left: a.left - ex, top: a.top - ey };
          logo.style.transformOrigin = '0 0';
          logo.style.transition = 'transform .5s cubic-bezier(.5,0,.2,1), opacity .25s linear .42s';
          logo.style.transform = 'translate3d(' + (b.left - a.left).toFixed(1) + 'px,' + (b.top - a.top).toFixed(1) + 'px,0) scale(' + s.toFixed(4) + ')';
          logo.style.opacity = '0';
          L.classList.add('flip');
        }
        if (window.MutationObserver) {
          var labelObserver = new MutationObserver(poll);
          labelObserver.observe(lab, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['data-key'] });
          var barObserver = new MutationObserver(poll);
          barObserver.observe(bar, { attributes: true, attributeFilter: ['style'] });
          var loaderObserver = new MutationObserver(function () {
            if (L.style.opacity === '0') leave();
          });
          loaderObserver.observe(L, { attributes: true, attributeFilter: ['style'] });
          observers.push(labelObserver, barObserver, loaderObserver);
        }
        setStageText('loading');
        stZh.textContent = EN ? 'Preparing' : '準備中'; stEn.textContent = EN ? '準備中' : 'Preparing';
        // portrait phones: the game is landscape — say so early, while it loads
        try {
          if (matchMedia('(orientation: portrait) and (max-width: 700px)').matches) {
            var rot = document.createElement('div'); rot.className = 'ld-rot';
            rot.innerHTML = '<i></i><span>' + (EN ? 'Turn your phone sideways for the best view' : '橫放手機體驗更佳') + '</span>';
            L.appendChild(rot);
          }
        } catch (e) {}

        // main.ts, right before it removes the loader: drop the observers and the decoded photo
        L.addEventListener('loader:dispose', function () {
          observers.forEach(function (o) { o.disconnect(); });
          if (ph && ph.parentNode) ph.parentNode.removeChild(ph);
        }, { once: true });
      })();
    </script>
